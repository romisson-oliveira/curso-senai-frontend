<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Template Desafios Guanabara</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            h1 {
                margin: 20px 0 20px 12px;
            }

            .container-button {
                margin-left: 20px;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: start;
                gap: 8px;
            }

            button {
                padding: 12px 12px;
                background-color: #ececec;
                color: #292424;
                font-size: 16px;
                border: 2px solid #b6adad;
                border-radius: 8px;
                box-shadow: 2px 3px 2px 0 #4632323b;
                cursor: pointer;
                transition:
                    background-color 0.3s ease,
                    color 0.3s ease;
            }
            button:hover {
                background-color: #292424;
                color: #ececec;
            }
        </style>
    </head>
    <body>
        <h1>Seu texto de título aparece aqui!</h1>

        <div class="container-button">
            <button onclick="mensagem1()">Botão 1</button>
            <button onclick="mensagem2()">Botão 2</button>
            <button onclick="mensagem3()">Botão 3</button>
        </div>

</html>
