<h1>Café Perfeito do Programador</h1>

<h2>Ingredientes:</h2>
<p>
    200ml de água mineral, 2 colheres de sopa de pó de café e açúcar (ou
    adoçante) à gosto.
</p>

<h2>Modo de Preparo:</h2>
<p>
    Insira o pó de café no recipiente da cafeteira, adicione água no local
    reservado, ligue a cafeteira. Ao término: sirva-se!
</p>
