<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Prática - Web</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <header class="topo-site">
    <div class="interface header-flex">
      <div class="logo">PRO-SITE</div>
      
      <nav class="menu">
        <a href="#inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>

    <!-- Subnav de boas-vindas do JavaScript -->
    <div id="subnav"></div>
  </header>

  <main>
    <!-- SEÇÃO 1: INÍCIO (HERO) -->
    <section id="inicio">
      <div class="interface hero-conteudo">
        <h1>O clima perfeito para o seu ambiente</h1> 
        <p>
            Instalação, manutenção e limpeza de Ar-Condicionado residencial e Comercial com garantia Técnica.
        </p>  
        <button>Saiba mais</button>      
      </div>
    </section>

    <!-- SEÇÃO 2: SERVIÇOS -->
    <section id="servicos">
      <div class="interface">
        <h2>Soluções em Climatização</h2>
        <div class="container-cards">
          <div>
            
            <img src="./imagens/card1.jpg" alt="">
            <h3>Instalação Express</h3>
            
          </div>
          <div>
            <img src="./imagens/card2.jpg" alt="">
            <h3>Manutenção Corretiva</h3>
          </div>
          <div>
            <img src="./imagens/card3.jpg" alt="">
            <h3>Limpeza Quimica</h3>

          </div>
        </div>
      </div>
    </section>

    <!-- SEÇÃO 3: CONTATO -->
    <section id="contato">
      <div class="interface contato-conteudo">
        <h2>Fale Conosco</h2>
        <a class="e-mail" href="mailto:suporte@clima.com">e-mail</a>
      </div>
      
    </section>
  </main>
  <script src="./script.js"></script>
  

</body>
</html>
