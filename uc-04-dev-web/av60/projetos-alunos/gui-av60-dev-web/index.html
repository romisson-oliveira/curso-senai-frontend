<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Prática - Web</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo-site">
        <div class="interface header-flex">
            <div class="logo">PRO-SITE</div>

            <nav class="menu">
                <a href="#inicio">Início</a>
                <a href="#servicos">Serviços</a>
                <!-- ⚠️ N.I - O texto abaixo era para continuar sendo Contatos -->
                <a href="#contato">viangens@explore</a>
            </nav>
        </div>

        <!-- Subnav de boas-vindas do JavaScript -->
        <div id="subnav"></div>
    </header>

    <main>
        <!-- SEÇÃO 1: INÍCIO (HERO) -->
        <section id="inicio">
            <div class="interface hero-conteudo">
                <h1>Colecione momentos, explore o mundo</h1>
                <p>Pacotes de viagens exclusivos com passagens, hospedagens e roteiros criados para a sua próxima
                    aventura.</p>
                <button>Saiba mais</button>
            </div>
        </section>

        <!-- SEÇÃO 2: SERVIÇOS -->
        <section id="servicos">
            <div class="interface">

                <h2>Destinos Mais Procurados</h2>
                <div class="container-cards">
                    <div>
                        <img src="./img/card1.jpg" alt="" width="400">
                        <h3>Praias do Nordeste</h3>                        
                    </div>

                    <div>
                        <img src="./img/card2.jpg" alt="" width="400">
                        <h3>Ecoturismo na Serra</h3>
                    </div>
                    <div>
                        <img src="./img/card3.jpg" alt="" width="400">
                        <h3>Eurotrip Inesquecível</h3>
                    </div>
                </div>
            </div>
        </section>

        <!-- SEÇÃO 3: CONTATO -->
        <section id="contato">
            <div class="interface contato-conteudo">
                <h2>Fale Conosco</h2>
                <!-- ❌ N.I - Aqui faltou o elemento <a> para o cliente entrar em contato com a agência. -->
            </div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
