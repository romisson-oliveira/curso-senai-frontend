<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Prática - Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <header class="topo-site">
        <div class="interface header-flex">
            <div class="logo">PRO-SITE</div>

            <nav class="menu">
                <a href="#inicio">Início</a>
                <a href="#servicos">Serviços</a>
                <a href="#contato">Contato</a>
            </nav>
        </div>

        <!-- Subnav de boas-vindas do JavaScript -->
        <div id="subnav"></div>
    </header>

    <main>
        <!-- SEÇÃO 1: INÍCIO (HERO) -->
        <section id="inicio">
            <div class="interface hero-conteudo">



                <h1>Cuidado premium que o seu veículo merece</h1>

                <p>Estética automotiva especializada com produtos de alta performace e profissionais detalhistas</p>

                <button>Saiba mais</button>

            </div>
        </section>

        <!-- SEÇÃO 2: SERVIÇOS -->
        <section id="servicos">
            <div class="interface">
                <h2>Nossos serviços especiais</h2>

                <div class="container-cards">

                    <!-- 
                        ❌ N.I - Questão 1.3
                        Pede para cada div ter DENTRO na ordem: 
                            1. uma img do card;
                            2. um h3.
                        Portanto, observe que seus h3 estão fora da div de card.
                    -->
                    <h3>Lavagem Detalhada</h3>

                    <div><img src="./imagens/card1.jpg" alt="" width="400px"></div>

                    <h3>Polimento Comercial</h3>

                    <div><img src="./imagens/card2.jpg" alt="" width="400px"></div>

                    <h3>Higienização Interna</h3>

                    <div><img src="./imagens/card3.jpg" alt="" width="400px"></div>


                </div>



            </div>
        </section>

        <!-- SEÇÃO 3: CONTATO -->
        <section id="contato">
            <div class="interface contato-conteudo">
                <h2>Fale Conosco</h2>

                <div class="mail"><a href="mailto:contato@lavajato.com"> Nosso Email!</a></div>
            </div>
        </section>
    </main>




<script src="./script.js"></script>

</body>

</html>
