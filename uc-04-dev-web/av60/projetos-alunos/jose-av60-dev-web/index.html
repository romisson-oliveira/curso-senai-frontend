<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Prática - Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo-site">
    <div class="interface header-flex">
      <div class="logo">PRO-SITE</div>
      
      <nav class="menu">
        <a href="#inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>

    <!-- Subnav de boas-vindas do JavaScript -->
    <div id="subnav"></div>
  </header>

  <main>
    <!-- SEÇÃO 1: INÍCIO (HERO) -->
    <section id="inicio">
      <div class="interface hero-conteudo"> 
        <h1>Colecione momentos, explore o mundo</h1>
        <!-- NOTA DO INSTRUTOR: O texto inserido dentro de parágrafo deve ser exatamente igual ao que que foi passado na documentação, respeitando espaços e não pode ter aspas. -->
        <p>"Pacotes de viagens exclusivos com passagens,hospedageme roteiros criados para a sua proxima aventura."</p>
        <button>Saiba Mais</button>      
      </div>
    </section>

    <!-- SEÇÃO 2: SERVIÇOS -->
    <section id="servicos">
      <div class="interface">
        <h2>Destino mais procurados</h2>
        <div class="container-cards">
    
      
        <div>
          <img src="imagens/card1.jpg" alt="card1.jpg"><h3>Praias do Nordeste</h3>
        </div>

        <div>
          <img src="imagens/card2.jpg" alt="card2.jpg"><h3>Ecoturismo na Serra</h3>
        </div>

        <div>
          <img src="imagens/card3.jpg" alt="card3.jpg"><h3>EuroTrip Inesquecivel</h3>
        </div>
</div>
      </div>
     
    </section>

    <!-- SEÇÃO 3: CONTATO -->
    <section id="contato">
      <div class="interface contato-conteudo">
        <h2>Fale Conosco</h2>
        <a href="mailto: viagens@explore.com">email</a>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
