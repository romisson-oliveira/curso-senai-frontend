<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Prática - Web</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <header class="topo-site">
    <div class="interface header-flex">
      <div class="logo">PRO-SITE</div>
      
      <nav class="menu">
        <a href="#inicio">Início</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>

    <!-- Subnav de boas-vindas do JavaScript -->
    <div id="subnav"></div>
  </header>

  <main>
    <!-- SEÇÃO 1: INÍCIO (HERO) -->
    <section id="inicio">
      <div class="interface hero-conteudo">
        <h1>O clima perfeito para o seu ambiente</h1>
        <p>Instalação, manutenção e limpeza de ar condicionado residencial e comercial com garantia técnica</p>
        <button>Saiba mais</button>       
      </div>
    </section>

    <!-- SEÇÃO 2: SERVIÇOS -->
    <section id="servicos">
      <div class="interface">
        <h2>Soluções em Climatização</h2>
        <div class="container-cards">
            <div>
                <img src="./imagens/card1.jpg" alt="card1">
                <h3>Instalação rápida</h3>
            </div>
            <div>
                <img src="./imagens/card2.jpg" alt="card2">
                <h3>Manutenção corretiva</h3>
            </div>
            <div>
                <img src="./imagens/card3.jpg" alt="card3">
                <h3>Limpeza Química</h3>

            </div>
        </div>
      </div>
    </section>

    <!-- SEÇÃO 3: CONTATO -->
    <section id="contato">
      <div class="interface contato-conteudo">
        <h2>Fale Conosco</h2>
        <a href="mailto: suporte@clima.com">Email</a>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
